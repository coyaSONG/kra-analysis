name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install dependencies
        working-directory: ./apps/api
        run: uv sync --all-extras --group dev
      - name: Ruff lint
        run: bash apps/api/scripts/run_quality_ci.sh lint
      - name: Ruff format check
        run: bash apps/api/scripts/run_quality_ci.sh format
      - name: Type check (mypy changed files)
        run: bash .github/scripts/mypy_changed.sh
      - name: Production training evidence regressions
        working-directory: ./apps/api
        run: |
          uv run --frozen ruff check ../../packages/scripts/autoresearch/training_evidence.py ../../packages/scripts/autoresearch/parameter_context.py ../../packages/scripts/ml/train_clean.py ../../packages/scripts/autoresearch/tests/test_training_evidence.py
          uv run --frozen ruff format --check ../../packages/scripts/autoresearch/training_evidence.py ../../packages/scripts/autoresearch/parameter_context.py ../../packages/scripts/ml/train_clean.py ../../packages/scripts/autoresearch/tests/test_training_evidence.py
          uv run --frozen python -m pytest -q ../../packages/scripts/autoresearch/tests/test_training_evidence.py -o addopts=''
      - name: Restricted ablation model regressions
        working-directory: ./apps/api
        run: |
          uv run --frozen ruff check ../../packages/scripts/autoresearch/restricted_ablation.py ../../packages/scripts/autoresearch/tests/test_restricted_ablation.py
          uv run --frozen ruff format --check ../../packages/scripts/autoresearch/restricted_ablation.py ../../packages/scripts/autoresearch/tests/test_restricted_ablation.py
          uv run --frozen python -m pytest -q ../../packages/scripts/autoresearch/tests/test_restricted_ablation.py -o addopts=''
      - name: Local M0 evaluation regressions
        working-directory: ./apps/api
        run: |
          uv run --frozen ruff check ../../packages/scripts/autoresearch/local_m0_evaluation.py ../../packages/scripts/autoresearch/tests/test_local_m0_evaluation.py
          uv run --frozen ruff format --check ../../packages/scripts/autoresearch/local_m0_evaluation.py ../../packages/scripts/autoresearch/tests/test_local_m0_evaluation.py
          uv run --frozen python -m pytest -q ../../packages/scripts/autoresearch/tests/test_local_m0_evaluation.py -o addopts=''
      - name: Local M0 forward regressions
        working-directory: ./apps/api
        run: |
          uv run --frozen ruff check ../../packages/scripts/autoresearch/local_m0_inference.py ../../packages/scripts/autoresearch/local_m0_forward.py ../../packages/scripts/autoresearch/tests/test_local_m0_forward.py
          uv run --frozen ruff format --check ../../packages/scripts/autoresearch/local_m0_inference.py ../../packages/scripts/autoresearch/local_m0_forward.py ../../packages/scripts/autoresearch/tests/test_local_m0_forward.py
          uv run --frozen python -m pytest -q ../../packages/scripts/autoresearch/tests/test_local_m0_forward.py -o addopts=''
      - name: API training opportunity regressions
        working-directory: ./apps/api
        run: |
          uv run --frozen ruff check ../../packages/scripts/autoresearch/api_training_opportunity.py ../../packages/scripts/autoresearch/tests/test_api_training_opportunity.py
          uv run --frozen ruff format --check ../../packages/scripts/autoresearch/api_training_opportunity.py ../../packages/scripts/autoresearch/tests/test_api_training_opportunity.py
          uv run --frozen python -m pytest -q ../../packages/scripts/autoresearch/tests/test_api_training_opportunity.py -o addopts=''
      - name: API27 fixed refit regressions
        working-directory: ./apps/api
        run: |
          uv run --frozen ruff check ../../packages/scripts/autoresearch/api27_refit.py ../../packages/scripts/autoresearch/tests/test_api27_refit.py
          uv run --frozen ruff format --check ../../packages/scripts/autoresearch/api27_refit.py ../../packages/scripts/autoresearch/tests/test_api27_refit.py
          uv run --frozen python -m pytest -q ../../packages/scripts/autoresearch/tests/test_api27_refit.py -o addopts=''
      - name: Prospective training input regressions
        working-directory: ./apps/api
        run: |
          uv run --frozen ruff check ../../packages/scripts/autoresearch/prospective_training_inputs.py ../../packages/scripts/autoresearch/tests/test_prospective_training_inputs.py
          uv run --frozen ruff format --check ../../packages/scripts/autoresearch/prospective_training_inputs.py ../../packages/scripts/autoresearch/tests/test_prospective_training_inputs.py
          uv run --frozen python -m pytest -q ../../packages/scripts/autoresearch/tests/test_prospective_training_inputs.py -o addopts=''
      - name: Official schedule regressions
        working-directory: ./apps/api
        run: |
          uv run --frozen ruff check ../../packages/scripts/shared/kra_schedule.py ../../packages/scripts/autoresearch/kra_schedule_snapshot.py ../../packages/scripts/autoresearch/tests/test_kra_schedule.py
          uv run --frozen ruff format --check ../../packages/scripts/shared/kra_schedule.py ../../packages/scripts/autoresearch/kra_schedule_snapshot.py ../../packages/scripts/autoresearch/tests/test_kra_schedule.py
          uv run --frozen python -m pytest -q ../../packages/scripts/autoresearch/tests/test_kra_schedule.py -o addopts=''
      - name: Stored prediction diagnostic regressions
        working-directory: ./apps/api
        run: |
          uv run --frozen ruff check ../../packages/scripts/autoresearch/october_paired_error_audit.py ../../packages/scripts/autoresearch/tests/test_october_paired_error_audit.py
          uv run --frozen ruff format --check ../../packages/scripts/autoresearch/october_paired_error_audit.py ../../packages/scripts/autoresearch/tests/test_october_paired_error_audit.py
          uv run --frozen python -m pytest -q ../../packages/scripts/autoresearch/tests/test_october_paired_error_audit.py -o addopts=''
      - name: Horse entry interval diagnostic regressions
        working-directory: ./apps/api
        run: |
          uv run --frozen ruff check ../../packages/scripts/autoresearch/horse_entry_interval_audit.py ../../packages/scripts/autoresearch/tests/test_horse_entry_interval_audit.py
          uv run --frozen ruff format --check ../../packages/scripts/autoresearch/horse_entry_interval_audit.py ../../packages/scripts/autoresearch/tests/test_horse_entry_interval_audit.py
          uv run --frozen python -m pytest -q ../../packages/scripts/autoresearch/tests/test_horse_entry_interval_audit.py -o addopts=''
      - name: Official result evidence regressions
        working-directory: ./apps/api
        run: |
          uv run --frozen ruff check ../../packages/scripts/shared/kra_result_history.py ../../packages/scripts/autoresearch/kra_result_snapshot.py ../../packages/scripts/autoresearch/kra_result_population_audit.py ../../packages/scripts/autoresearch/kra_race_card_pdf_replay.py ../../packages/scripts/autoresearch/tests/test_kra_result_snapshot.py ../../packages/scripts/autoresearch/tests/test_kra_result_population_audit.py
          uv run --frozen ruff format --check ../../packages/scripts/shared/kra_result_history.py ../../packages/scripts/autoresearch/kra_result_snapshot.py ../../packages/scripts/autoresearch/kra_result_population_audit.py ../../packages/scripts/autoresearch/kra_race_card_pdf_replay.py ../../packages/scripts/autoresearch/tests/test_kra_result_snapshot.py ../../packages/scripts/autoresearch/tests/test_kra_result_population_audit.py
          uv run --frozen python -m pytest -q ../../packages/scripts/autoresearch/tests/test_kra_result_snapshot.py ../../packages/scripts/autoresearch/tests/test_kra_result_population_audit.py ../../packages/scripts/autoresearch/tests/test_kra_race_card_pdf_replay.py ../../packages/scripts/autoresearch/tests/test_kra_race_card_pdf_bundle.py -o addopts=''
      - name: Unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: test-secret-key
          ENVIRONMENT: test
        run: bash apps/api/scripts/run_quality_ci.sh unit
      - name: Integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          KRA_MIGRATION_TEST_DSN: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: test-secret-key
          ENVIRONMENT: test
          RATE_LIMIT_ENABLED: 'false'
        run: bash apps/api/scripts/run_quality_ci.sh integration
      - name: Coverage
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          KRA_MIGRATION_TEST_DSN: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: test-secret-key
          ENVIRONMENT: test
        run: bash apps/api/scripts/run_quality_ci.sh coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./apps/api/coverage.xml
          flags: api
          fail_ci_if_error: false

  scripts-checks:
    name: Scripts Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        working-directory: ./packages/scripts
        run: uv sync --frozen --group dev --extra race-card-pdf
      - name: PDF entry replay regressions
        working-directory: ./packages/scripts
        run: uv run --frozen --extra race-card-pdf python -m pytest -q autoresearch/tests/test_kra_race_card_pdf_replay.py autoresearch/tests/test_kra_race_card_pdf_bundle.py -o addopts=''
      - name: Pre-race public hash witness regressions
        working-directory: ./packages/scripts
        run: |
          uv run --frozen --extra race-card-pdf ruff check autoresearch/prerace_hash_witness.py autoresearch/tests/test_prerace_hash_witness.py
          uv run --frozen --extra race-card-pdf ruff format --check autoresearch/prerace_hash_witness.py autoresearch/tests/test_prerace_hash_witness.py
          uv run --frozen --extra race-card-pdf python -m pytest -q autoresearch/tests/test_prerace_hash_witness.py -o addopts=''
      - name: Restricted cohort source regressions
        working-directory: ./packages/scripts
        run: |
          uv run --frozen --extra race-card-pdf ruff check autoresearch/restricted_cohort.py autoresearch/tests/test_restricted_cohort.py
          uv run --frozen --extra race-card-pdf ruff format --check autoresearch/restricted_cohort.py autoresearch/tests/test_restricted_cohort.py
          uv run --frozen --extra race-card-pdf python -m pytest -q autoresearch/tests/test_restricted_cohort.py -o addopts=''
      - name: Observed history seed regressions
        working-directory: ./packages/scripts
        run: |
          uv run --frozen ruff check autoresearch/observed_history_seed.py shared/observed_result_history.py autoresearch/tests/test_observed_history_seed.py autoresearch/tests/test_observed_result_history.py
          uv run --frozen ruff format --check autoresearch/observed_history_seed.py shared/observed_result_history.py autoresearch/tests/test_observed_history_seed.py autoresearch/tests/test_observed_result_history.py
          uv run --frozen python -m pytest -q autoresearch/tests/test_observed_history_seed.py autoresearch/tests/test_observed_result_history.py -o addopts=''
      - name: History identity collision regressions
        working-directory: ./packages/scripts
        run: |
          uv run --frozen ruff check autoresearch/history_identity_audit.py autoresearch/tests/test_history_identity_audit.py
          uv run --frozen ruff format --check autoresearch/history_identity_audit.py autoresearch/tests/test_history_identity_audit.py
          uv run --frozen python -m pytest -q autoresearch/tests/test_history_identity_audit.py autoresearch/tests/test_kra_result_snapshot.py -o addopts=''
      - name: Frozen partial history regressions
        working-directory: ./packages/scripts
        run: |
          uv run --frozen ruff check autoresearch/frozen_history_view.py autoresearch/observed_partial_projection.py shared/observed_partial_history.py autoresearch/tests/test_frozen_partial_history.py
          uv run --frozen ruff format --check autoresearch/frozen_history_view.py autoresearch/observed_partial_projection.py shared/observed_partial_history.py autoresearch/tests/test_frozen_partial_history.py
          uv run --frozen python -m pytest -q autoresearch/tests/test_frozen_partial_history.py -o addopts=''
      - name: Official history support regressions
        working-directory: ./packages/scripts
        run: |
          uv run --frozen ruff check autoresearch/official_history_support.py shared/official_result_support.py autoresearch/tests/test_official_history_support.py
          uv run --frozen ruff format --check autoresearch/official_history_support.py shared/official_result_support.py autoresearch/tests/test_official_history_support.py
          uv run --frozen python -m pytest -q autoresearch/tests/test_official_history_support.py -o addopts=''
      - name: Official history recency regressions
        working-directory: ./packages/scripts
        run: |
          uv run --frozen ruff check autoresearch/official_history_recency.py autoresearch/tests/test_official_history_recency.py
          uv run --frozen ruff format --check autoresearch/official_history_recency.py autoresearch/tests/test_official_history_recency.py
          uv run --frozen python -m pytest -q autoresearch/tests/test_official_history_recency.py -o addopts=''
      - name: Versioned result observation regressions
        working-directory: ./packages/scripts
        run: |
          uv run --frozen ruff check autoresearch/versioned_result_observations.py autoresearch/tests/test_versioned_result_observations.py
          uv run --frozen ruff format --check autoresearch/versioned_result_observations.py autoresearch/tests/test_versioned_result_observations.py
          uv run --frozen python -m pytest -q autoresearch/tests/test_versioned_result_observations.py -o addopts=''
      - name: Scripts CI (lint + tests)
        run: pnpm run quality:scripts:ci

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.13'
      - name: Python dependency audit
        run: |
          uvx pip-audit -r apps/api/requirements.txt
          uv export --all-packages --all-groups --format requirements-txt --no-hashes --no-emit-project --no-emit-workspace --output-file /tmp/all-requirements.txt
          uvx pip-audit -r /tmp/all-requirements.txt
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Node.js audit
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=low
      - name: Repository hygiene checks
        run: bash .github/scripts/security_checks.sh

  docker-build:
    name: API Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t kra-api-ci .
      - name: Smoke-test application import
        run: |
          docker run --rm \
            -e SECRET_KEY=ci-secret-key-ci-secret-key \
            -e DATABASE_URL=postgresql+asyncpg://test:test@localhost:5432/test_db \
            -e REDIS_URL=redis://localhost:6379/15 \
            kra-api-ci \
            python -c 'from main_v2 import app; print(app.title)'
